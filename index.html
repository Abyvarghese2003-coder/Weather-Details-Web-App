<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather app</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
     <link rel="stylesheet" href="./style.css">
       <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&display=swap" rel="stylesheet">
</head>
<body>
    <div style="min-height:100vh;" class=" d-flex justify-content-center align-items-center flex-column">
        <div class="container weatherbody rounded-4 p-5 shadow-lg">
            <div class="row">
                <div class="col-md-8">
                    <h1>Weather DATA</h1>
                    <div class="text-center my-3">
                        <img src="./M8VyA2h.png" class="w-25" alt="">
                    </div>
                    <h2 class="text-white fw-bold display-4" id="temp">temp °C </h2>
                    <h3 id="feels">Feels like °C </h3>
                    <h2 id="cityy">City</h2>
                    <p id="tempdate">Date</p>
                    <div class="d-flex align-items-center gap-2">
                       
                        <img id="weatherIcon" src="" alt="" style="width: 50px;">
                        <span id="weatherCondition" class="fs-5 text-capitalize"></span>
                    </div>
                </div>
                <div class="col-md-4  text-light rounded-3" style="background-color: rgba(255, 255, 255, 0.08);">
                    <div class="d-flex align-items-center my-3">
                        <input type="text" name="" id="city" placeholder="input city name" class="form-control" value="Palakkad" onkeydown="if(event.key==='Enter') searchCityWeather()">
                        <button onclick="searchCityWeather()" class="btn"><i class="fa-solid fa-search text-light"></i></button>
                    </div>
                    <hr>
                    <p class="text-light">Weather Details</p>
                    <div class="my-3">
                        <h4 >Country</h4>
                        <h5 id="country">IN</h5>
                    </div>
                      <div class="my-3">
                        <h4 >Humidity</h4>
                        <h5 id="Humidity">IN</h5>
                    </div>
                      <div class="my-3">
                        <h4>Wind</h4>
                        <h5 id="wind">IN</h5>
                    </div>
                      <div class="my-3">
                        <h4>Pressure</h4>
                        <h5 id="Pressure">IN</h5>
                    </div>

                </div>
            </div>
        </div>
    </div>
    <script>
        const searchCityWeather=async()=>
    {
        const cityname=city.value
        console.log(cityname);
        if(cityname)
    {
        try
        {
            const response=await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${cityname}&appid=8ac5c4d57ba6a4b3dfcf622700447b1e&units=metric`)
        // console.log(cityname);
        const details=await response.json()
        if(response.status==200)
        {
            console.log(details);
            temp.innerHTML=`${details.main.temp} °C`
            feels.innerHTML=`Feels Like ${details.main.feels_like} °C `
            cityy.innerHTML=`${details.name}`
            Humidity.innerHTML=`${details.main.humidity} %`
            wind.innerHTML=`${details.wind.speed} m/s`
            // for date
            const localDate = new Date((details.dt + details.timezone) * 1000);
            tempdate.innerHTML = localDate.toUTCString().slice(0, 16);
            Pressure.innerHTML=`${details.main.pressure} hPa`
            country.innerHTML=`${details.sys.country}`
            weatherIcon.src = `https://openweathermap.org/img/wn/${details.weather[0].icon}@2x.png`;
            weatherCondition.innerHTML = details.weather[0].description;

            
        }
        else
        {
            alert(details.message)
        }
        }
        catch(err)
        {
            console.log(err);
            
        }
        
    }
    else
    {
        alert("Fill in the form")
    }
        
    }
    searchCityWeather()
    </script>
    
</body>
</html>
